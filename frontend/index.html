<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Hospital - Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <header>
      <h1>My Hospital</h1>
      <div id="user-controls"></div>
    </header>

    <section id="auth-section">
      <h2>Login</h2>
      <form id="login-form">
        <input name="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" required />
        <button>Login</button>
      </form>
      <div id="auth-msg"></div>
    </section>

    <section id="dashboard" class="hidden">
      <h2>Dashboard</h2>
      <div id="controls">
        <button id="btn-refresh">Refresh Patients</button>
        <button id="btn-add" class="role-nurse role-doctor role-admin">Add Patient</button>
        <input id="file-import" type="file" accept=".csv" />
        <button id="btn-generate" class="role-admin">Generate Report Now</button>
      </div>

      <div id="patients-list"></div>

      <h3>Reports</h3>
      <div id="reports-list"></div>
    </section>

    <footer>
      <small>Offline-first My Hospital app</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
